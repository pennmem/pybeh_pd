[pytest]
testpaths = tests
markers =
    hand_coded: concrete input -> hand-verified expected output
    property: mathematical property (bounds, symmetry, identity, consistency)
    edge_case: inputs that could silently invalidate results
    consistency: cross-function / large-sample agreement
    regression: golden-master behavior lock
    integration: end-to-end pipeline on synthetic or real data
    pins_bug: pins CURRENT (known-buggy) behavior; see bug_report.md
